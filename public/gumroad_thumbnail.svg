<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1626" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Radial Emerald Glow -->
    <radialGradient id="thumbGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="accentTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="miniCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151e2e" />
      <stop offset="100%" stop-color="#0d1422" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#bgSquare)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="240" r="280" fill="url(#thumbGlow)" />

  <!-- Outer Border -->
  <rect x="10" y="10" width="580" height="580" rx="36" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Badge Pill -->
  <g transform="translate(195, 65)">
    <rect width="210" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="105" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="2" text-anchor="middle">LIFETIME PASS • $39</text>
  </g>

  <!-- App Logo / Icon Box -->
  <g transform="translate(250, 125)">
    <rect width="100" height="100" rx="24" fill="url(#miniCard)" stroke="#10b981" stroke-opacity="0.5" stroke-width="2" />
    <path d="M 50 22 L 56 42 L 78 50 L 56 58 L 50 78 L 44 58 L 22 50 L 44 42 Z" fill="url(#accentTitle)" />
  </g>

  <!-- Brand Title -->
  <text x="300" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1" text-anchor="middle">
    HookForge <tspan fill="url(#accentTitle)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="300" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="-0.2" text-anchor="middle">
    Viral Script, Hook &amp; Carousel Studio
  </text>

  <!-- 3 Mini Feature Pills -->
  <g transform="translate(60, 360)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="70" rx="16" fill="url(#miniCard)" stroke="#1e293b" stroke-width="1" />
    <text x="72" y="32" font-family="sans-serif" font-size="18" fill="#34d399" text-anchor="middle">⚡</text>
    <text x="72" y="54" font-family="sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">5 Viral Hooks</text>

    <!-- Pill 2 -->
    <rect x="165" y="0" width="150" height="70" rx="16" fill="url(#miniCard)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="240" y="32" font-family="sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle">🎬</text>
    <text x="240" y="54" font-family="sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">60s Video Script</text>

    <!-- Pill 3 -->
    <rect x="335" y="0" width="145" height="70" rx="16" fill="url(#miniCard)" stroke="#1e293b" stroke-width="1" />
    <text x="407" y="32" font-family="sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle">🎨</text>
    <text x="407" y="54" font-family="sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Carousel Deck</text>
  </g>

  <!-- Bottom Guarantee Banner -->
  <g transform="translate(80, 480)">
    <rect width="440" height="50" rx="14" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.25" stroke-width="1" />
    <text x="220" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
      ✓ ZERO WATERMARKS • ✓ COMMERCIAL LICENSE
    </text>
  </g>
</svg>