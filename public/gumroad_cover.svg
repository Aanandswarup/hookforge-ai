  <text x="640" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5" text-anchor="middle">
    HookForge <tspan fill="url(#accent)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="-0.3" text-anchor="middle">
    Viral Hooks • 60s Retention Scripts • In-Browser Visual Carousel Studio
  </text>

  <!-- 3 Feature Pillars (Bento Cards) -->
  <g transform="translate(140, 310)">
    <!-- Card 1 -->
    <rect width="300" height="240" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="50" cy="50" r="22" fill="#10b981" fill-opacity="0.15" />
    <text x="50" y="56" font-family="sans-serif" font-size="18" fill="#34d399" text-anchor="middle">⚡</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">5 Viral Hooks</text>
    <text x="30" y="145" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Curiosity gap, contrarian,</text>
    <text x="30" y="165" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">story &amp; data hooks with</text>
    <text x="30" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">real-time CTR virality scores</text>
  </g>

  <g transform="translate(490, 310)">
