    <text x="30" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#a78bfa">batch PNG &amp; PDF export</text>
  </g>

  <!-- Bottom Trust Bar -->
  <g transform="translate(0, 620)">
    <line x1="200" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="640" y="45" font-family="sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">
