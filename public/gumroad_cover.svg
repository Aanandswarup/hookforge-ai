    <rect width="300" height="240" rx="20" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="50" cy="50" r="22" fill="#06b6d4" fill-opacity="0.15" />
    <text x="50" y="56" font-family="sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle">🎬</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">60s Video Script</text>
    <text x="30" y="145" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">B-roll visual cues, text overlays</text>
    <text x="30" y="165" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">&amp; sound FX direction with</text>
    <text x="30" y="185" font-family="sans-serif" font-size="13" font-weight="700" fill="#22d3ee">built-in Teleprompter mode</text>
  </g>

  <g transform="translate(840, 310)">
    <!-- Card 3 -->
    <rect width="300" height="240" rx="20" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="50" cy="50" r="22" fill="#8b5cf6" fill-opacity="0.15" />
    <text x="50" y="56" font-family="sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle">🎨</text>
    <text x="30" y="115" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Carousel Studio</text>
    <text x="30" y="145" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8">1080×1350 Canvas Engine</text>
